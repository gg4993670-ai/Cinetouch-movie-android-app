name: cinetouch
description: "Cinetouch - Streaming Application"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🚀 App Kill Proof Background Downloader
  background_downloader: ^8.5.1

  # 🔔 Runtime Permission Request (Android 13+ Notification Allow karne ke liye)
  permission_handler: ^11.3.1

  # 🌐 Network & Offline Detection
  connectivity_plus: ^6.0.3

  provider: ^6.1.1
  cached_network_image: ^3.3.1
  video_player: ^2.8.6
  http: ^1.2.1
  cupertino_icons: ^1.0.8
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.5.0
  shared_preferences: ^2.3.5
  google_nav_bar: ^5.0.6
  glassmorphism: ^3.0.0
  url_launcher: ^6.2.5
  dio: ^5.8.0+1
  open_filex: ^4.5.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutterfire_cli: ^1.4.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "web/favicon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true